<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Biblioteca</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: #172033; background: white; }
    header { height: 54px; padding: 0 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px #0002; }
    .logo { color: #1760ff; font-size: 19px; font-weight: bold; text-decoration: none; }
    nav { display: flex; gap: 20px; align-items: center; }
    nav a { color: #334155; text-decoration: none; font-size: 14px; }
    nav .cadastro { background: #1760ff; color: white; padding: 10px 14px; border-radius: 7px; }
    main { min-height: calc(100vh - 54px); display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
    .formulario { width: 100%; max-width: 380px; }
    h1 { text-align: center; font-size: 30px; margin: 0 0 8px; }
    .subtitulo { text-align: center; color: #64748b; margin: 0 0 28px; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: bold; margin: 16px 0 8px; color: #475569; }
    input { width: 100%; border: 1px solid #d8dee8; border-radius: 7px; padding: 12px; font-size: 14px; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 7px; background: #00a844; color: white; font-weight: bold; cursor: pointer; margin-top: 14px; }
    .ou { display: flex; align-items: center; gap: 10px; margin: 22px 0; color: #8490a2; font-size: 12px; }
    .ou::before, .ou::after { content: ""; height: 1px; background: #e2e8f0; flex: 1; }
    .google { border: 1px solid #d8dee8; color: #172033; background: white; margin: 0; }
    .rodape { text-align: center; color: #64748b; font-size: 14px; margin-top: 22px; }
    .rodape a { color: #1760ff; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">▢ Biblioteca</a>
    <nav><a href="login.html">Login</a><a class="cadastro" href="cadastro.html">Cadastro</a></nav>
  </header>
  <main>
    <form class="formulario" action="#" method="post">
      <h1>Criar Conta</h1>
      <p class="subtitulo">Junte-se à nossa comunidade de leitores</p>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
      <label for="confirmar">Confirmar Senha</label>
      <input type="password" id="confirmar" name="confirmar" placeholder="Confirme sua senha" required>
      <button type="submit">Criar Conta</button>
      <div class="ou">Ou continue com</div>
      <button type="button" class="google">G&nbsp; Google</button>
      <p class="rodape">Já tem uma conta? <a href="login.html">Faça login</a></p>
    </form>
  </main>
</body>
</html>
